name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag, for example v0.1.0'
        required: true
        type: string
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'susunola/WeSwitch' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version and resolve an existing tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'A stable version tag such as v0.1.0 is required.' >&2
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Verify Apple Silicon Python
        run: python -c 'import platform; assert platform.machine() == "arm64", platform.machine()'
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Build the native macOS app
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/build_macos.py --version "$RELEASE_TAG"
      - name: Smoke-test the standalone executable
        run: python scripts/smoke_app.py dist/WeSwitch.app/Contents/MacOS/WeSwitch
      - uses: actions/upload-artifact@v4
        with:
          name: WeSwitch-${{ needs.prepare.outputs.tag }}-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/WeSwitch-${{ needs.prepare.outputs.tag }}-macos-arm64.zip
            dist/WeSwitch-${{ needs.prepare.outputs.tag }}-macos-arm64.zip.sha256

  release:
    needs: [prepare, build]
    if: >-
      github.repository == 'susunola/WeSwitch' &&
      startsWith(needs.prepare.outputs.tag, 'v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WeSwitch-${{ needs.prepare.outputs.tag }}-macos-arm64
          path: release-assets
      - name: Verify artifacts and publish the existing tag
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          archive="WeSwitch-$RELEASE_TAG-macos-arm64.zip"
          sha256sum --check "$archive.sha256"
          current_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$current_commit" = "$BUILD_COMMIT"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --repo "$GH_REPO" --verify-tag --title "WeSwitch $RELEASE_TAG" \
            --notes '## WeSwitch ${{ needs.prepare.outputs.tag }}

Batch model configuration for Codex Mac. Chinese by default, with an English toggle.
一次添加多个模型：一个提供方、一份凭据，多个模型 ID（如 Pro / Flash）同时保存。

### Downloads
- Apple Silicon: `WeSwitch-${{ needs.prepare.outputs.tag }}-macos-arm64.zip`. Extract and open WeSwitch.app. Python is bundled, so no Python, Homebrew or WorkBuddy installation is needed; the app opens a local browser UI.
- Intel Mac: use the source archive or `Start WeSwitch.command` with Python 3.11+. No standalone Intel binary is included.

### What is new
- Add several models at once: one model ID per line, or multi-select from a fetched list. The default model is written to the root `model`; the rest are saved as named Codex profiles under the same provider.
- Codex has no per-provider model list, so profiles are the supported mechanism. Profile names combine the provider ID and model ID. Existing profiles with settings this tool does not write are never overwritten.
- Editing a saved provider reloads every model previously saved for it.

### Verification
- 198 unit/API/localization tests and 163 real-browser assertions passed.
- GitHub CI passed on Python 3.11 and 3.13; the macOS 14 arm64 build and isolated standalone smoke test passed.
- A SHA-256 companion file is published for the app ZIP. Checksums verify file integrity, not publisher identity.

### Limitations
- No Developer ID signing or Apple notarization. An ad-hoc signature is not a verified publisher identity; Gatekeeper may warn or block launch. Do not disable Gatekeeper globally.
- Switching between saved models depends on your Codex build supporting profiles. This tool does not guarantee that the desktop model picker shows them.
- Listing models is metadata discovery, not a Responses/tool-call compatibility test. Restart Codex fully after applying changes.

MIT License. Independent community project; not affiliated with OpenAI. See README.md and README.en.md.'
